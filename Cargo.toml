[package]
name = "dyt-ashare-cli"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "DYT AShare research CLI with reproducible datasets and agent skills"
repository = "https://github.com/renjiegod/dyt-ashare-cli"
default-run = "dytcn"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "dytcn"
path = "src/main.rs"
